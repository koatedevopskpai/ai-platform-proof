name: Evaluation Gate

on:
  pull_request:
    paths:
      - "services/rag-api/**"
      - "services/evaluator/**"
  workflow_dispatch:

jobs:
  eval-gate:
    name: Run quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator
        run: pip install -r services/evaluator/requirements.txt
      - name: Run evaluation gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # optional; mock judge used otherwise
        run: |
          python -m evaluator \
            --dataset services/evaluator/datasets/eval_set.jsonl \
            --threshold 0.80 \
            --report eval-report.json
        working-directory: services/evaluator
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/evaluator/eval-report.json
        if: always()