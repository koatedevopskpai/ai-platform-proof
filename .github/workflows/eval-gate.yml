name: Release acceptance contracts (offline)
on:
  pull_request:
    paths: ['scripts/release/**', 'tests/**', 'services/rag-api/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
# Actual HTTP candidate acceptance runs inline in deploy-cheap.yml before promotion.
# This offline job does not assert live quality or score stored dataset answers.
