name: Immutable Compose release (synthetic mock)
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: compose-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: compose-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Build once and record immutable image IDs
        run: python scripts/release/release.py build --out "$RUNNER_TEMP/release"
      - name: Configure verified SSH host identity
        env:
          SSH_KEY: ${{ secrets.CHEAP_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHEAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer and deploy the exact bundle
        env:
          HOST: ${{ secrets.CHEAP_HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          ssh -o StrictHostKeyChecking=yes "ec2-user@$HOST" "mkdir -p releases/$GITHUB_SHA-$GITHUB_RUN_ID"
          scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/release/"* scripts/release/release.py "ec2-user@$HOST:releases/$GITHUB_SHA-$GITHUB_RUN_ID/"
          ssh -o StrictHostKeyChecking=yes "ec2-user@$HOST" "python3 releases/$GITHUB_SHA-$GITHUB_RUN_ID/release.py deploy --bundle releases/$GITHUB_SHA-$GITHUB_RUN_ID --expected-source $GITHUB_SHA --receipt releases/$GITHUB_SHA-$GITHUB_RUN_ID/receipt.json"
      - name: Retrieve receipt including failed deployment
        if: always()
        env:
          HOST: ${{ secrets.CHEAP_HOST }}
        run: scp -o StrictHostKeyChecking=yes "ec2-user@$HOST:releases/$GITHUB_SHA-$GITHUB_RUN_ID/receipt.json" "$RUNNER_TEMP/release/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-release-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/compose.json
            ${{ runner.temp }}/release/receipt.json
