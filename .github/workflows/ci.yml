name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dotnet-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore src/IngestApi/IngestApi.csproj --locked-mode
      - run: dotnet build src/IngestApi/IngestApi.csproj --no-restore -c Release
      - run: dotnet test tests/IngestApi.Tests/IngestApi.Tests.csproj --no-restore -c Release

  node:
    name: TypeScript build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # rag-api and evaluator are separate jobs so a failure is attributable.
  #
  # They used to share one job: a ragas installation failure and a rag-api test failure both surfaced
  # as "Python build + test", which made triage guesswork. They also run in parallel now, and the
  # evaluator's dependency install no longer gates feedback on the service.
  rag-api:
    name: Python — rag-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads against the pinned requirement files. The key is derived from their
          # content, so changing a pin invalidates it automatically — a stale cache cannot mask a
          # dependency change. All four files are listed so both Python jobs share one cache.
          cache: pip
          cache-dependency-path: |
            services/rag-api/requirements.txt
            services/rag-api/requirements-dev.txt
            services/evaluator/requirements.txt
            services/evaluator/requirements-dev.txt
      - name: Install rag-api deps
        run: pip install -r services/rag-api/requirements-dev.txt
      - name: Test rag-api
        run: python -m pytest services/rag-api/tests -q

  evaluator:
    name: Python — evaluator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/rag-api/requirements.txt
            services/rag-api/requirements-dev.txt
            services/evaluator/requirements.txt
            services/evaluator/requirements-dev.txt
      - name: Install evaluator deps
        run: pip install -r services/evaluator/requirements-dev.txt
      - name: Test evaluator
        run: python -m pytest services/evaluator/tests -q
