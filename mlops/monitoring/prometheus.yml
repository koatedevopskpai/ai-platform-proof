global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - prometheus-rules.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:8000"]

  - job_name: dotnet-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["dotnet-ingest:8080"]